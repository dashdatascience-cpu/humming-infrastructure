
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-gcp-agent
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-gcp-agent-manager
  namespace: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins-gcp-agent
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agent-manager

