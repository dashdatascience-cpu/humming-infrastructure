apiVersion: v1
kind: Service
metadata:
  name: jenkins-public
  namespace: jenkins
spec:
  type: LoadBalancer
  loadBalancerClass: networking.gke.io/l4-regional-external
  selector:
    app.kubernetes.io/instance: humming-traefik-jenkins
    app.kubernetes.io/name: traefik
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
